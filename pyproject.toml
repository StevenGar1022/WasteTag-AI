[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wastetag-ai"
version = "0.5.5"
description = "WASTETAG-AI — Herramienta interactiva de Auto-Etiquetado YOLO"
requires-python = ">=3.10"
dependencies = ["ultralytics>=8.4.163", "rich"]

[project.scripts]
wastetag-ai = "src.wastetag_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
